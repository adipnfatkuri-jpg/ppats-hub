    <script>
      (function () {
        window.__simPpatsDeferredPrompt = null;
        window.__simPpatsAppInstalled = false;
        window.addEventListener('beforeinstallprompt', function (e) {
          e.preventDefault();
          window.__simPpatsDeferredPrompt = e;
          window.dispatchEvent(new Event('simppats:pwa-prompt-ready'));
        });
        window.addEventListener('appinstalled', function () {
          window.__simPpatsAppInstalled = true;
          window.__simPpatsDeferredPrompt = null;
          window.dispatchEvent(new Event('simppats:pwa-installed'));
        });
      })();
    </script>
